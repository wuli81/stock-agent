# ruff 配置（仓库根，覆盖 shared / backend / trade-executor）
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "W", "UP", "B", "DTZ"]

[lint.flake8-bugbear]
# FastAPI 官方推荐：允许在参数默认值中使用 Depends/Query 等
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Security",
]
[lint.per-file-ignores]
"backend/migrations/*" = ["E501", "W291"]

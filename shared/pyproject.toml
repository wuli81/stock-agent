[project]
name = "stock-agent-shared"
version = "1.0.0"
description = "stock-agent 共享层（数据结构 / 枚举 / 常量）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared"]
package-dir = { shared = "." }